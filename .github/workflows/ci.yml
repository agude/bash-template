name: CI

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Exercise the minimum uv on the Python version Dependabot selects.
      UV_PYTHON: "3.11"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: just sync
      - run: just lint
        env:
          # Lets zizmor run its online audits, such as impostor-commit checks.
          GH_TOKEN: ${{ github.token }}

  test-bash-5:
    name: Test on Bash 5 (Ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: just test
        env:
          EXPECT_BASH: "5"

  test-bash-3-2:
    name: Test on Bash 3.2 (Alpine container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      # Pinned by digest; update it by hand when the bash:3.2 tag moves.
      image: bash:3.2@sha256:0fd7cb8499c63a3c9345e7088a9cd83bb69f6e895e83833859aff838a0312091
    steps:
      # Checkout needs git to fetch the submodules.
      - name: Install git and just
        run: apk add --no-cache git just
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: just test
        env:
          EXPECT_BASH: "3.2"

  test-macos:
    name: Test on Bash 3.2 (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # Put the system Bash 3.2 ahead of any Homebrew Bash. This leg also
      # covers the BSD userland.
      - name: Use the system Bash
        run: echo /bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: just test
        env:
          EXPECT_BASH: "3.2"
